<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Library System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #e3f2fd, #ffffff);
            height: 100vh;
        }

        .login-box {
            width: 400px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .title {
            font-weight: bold;
            color: #0d6efd;
        }
    </style>
</head>

<body>

<div class="container d-flex justify-content-center align-items-center h-100">

    <div class="login-box">

        <h3 class="text-center title mb-4">Library Login</h3>

        <!-- ERROR -->
        {% if form.errors %}
            <div class="alert alert-danger">
                Invalid username or password
            </div>
        {% endif %}

        <!-- LOGIN FORM -->
        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}

            <div class="mb-3">
                <label>Username</label>
                <input type="text" name="username" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>

            <button class="btn btn-primary w-100">
                Login
            </button>
        </form>

        <hr>

        <!-- ROLE OPTIONS (NO BACKEND CHANGE) -->
        <div class="text-center">
            <p class="mb-2 text-muted">Choose Login Type</p>

            <a href="/admin/" class="btn btn-dark w-100 mb-2">
                Admin Login
            </a>

            <a href="/login/" class="btn btn-outline-primary w-100">
                Student Login
            </a>
        </div>

        <p class="text-center mt-3 text-muted" style="font-size: 13px;">
            Library Management System
        </p>

    </div>

</div>

</body>
</html>
