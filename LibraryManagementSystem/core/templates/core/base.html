<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Library Management System</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f5f7fb;
        }

        .navbar {
            margin-bottom: 20px;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">

    <a class="navbar-brand" href="{% url 'dashboard' %}">
        📚 Library System
    </a>

    <div class="navbar-nav">

        <a class="nav-link" href="{% url 'dashboard' %}">Dashboard</a>
        <a class="nav-link" href="{% url 'books-page' %}">Books</a>
        <a class="nav-link" href="{% url 'members-page' %}">Members</a>
        <a class="nav-link" href="{% url 'issue-books-page' %}">Issued Books</a>

    </div>

    <div class="ms-auto">
        <a class="btn btn-danger btn-sm" href="{% url 'logout' %}">
            Logout
        </a>
    </div>

</nav>

<!-- CONTENT AREA -->
<div class="container">

    {% block content %}
    {% endblock %}

</div>

</body>
</html>
