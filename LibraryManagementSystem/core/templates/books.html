{% extends 'core/base.html' %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <h1>📖 Books Management</h1>

```
<a href="/books/add/" class="btn btn-primary">
    ➕ Add Book
</a>
```

</div>

<div class="card shadow">
    <div class="card-body">

```
    <table class="table table-striped table-hover text-center">
        <thead class="table-dark">
            <tr>
                <th>Title</th>
                <th>Author</th>
                <th>ISBN</th>
                <th>Quantity</th>
                <th>QR Code</th>
            </tr>
        </thead>

        <tbody>

            {% for book in books %}
            <tr>
                <td>{{ book.title }}</td>
                <td>{{ book.author }}</td>
                <td>{{ book.isbn }}</td>
                <td>{{ book.quantity }}</td>

                <td>
                    <a href="/books/qr/{{ book.id }}/"
                       class="btn btn-info btn-sm">
                        QR Code
                    </a>
                </td>
            </tr>

            {% empty %}
            <tr>
                <td colspan="5">
                    No books available.
                </td>
            </tr>
            {% endfor %}

        </tbody>

    </table>

</div>
```

</div>

{% endblock %}
