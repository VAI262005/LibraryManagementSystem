<!DOCTYPE html>
<html>
<head>
    <title>Add Member</title>
</head>
<body>

<h1>Add New Member</h1>

<a href="/api/members-page/">Back to Members</a>

<hr>

<form method="POST">
    {% csrf_token %}

    <p>
        <label>Name:</label>
        <input type="text" name="name" required>
    </p>

    <p>
        <label>Email:</label>
        <input type="email" name="email" required>
    </p>

    <p>
        <label>Phone:</label>
        <input type="text" name="phone" required>
    </p>

    <button type="submit">
        Add Member
    </button>

</form>

</body>
</html>
