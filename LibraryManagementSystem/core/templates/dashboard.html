<!DOCTYPE html>
<html>
<head>
<title>Admin Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body { background:#f4f6fa; }

.sidebar {
    width: 240px;
    height: 100vh;
    position: fixed;
    background:#111827;
    padding:20px;
    color:white;
}

.sidebar a {
    display:block;
    color:#cbd5e1;
    padding:10px;
    text-decoration:none;
}

.sidebar a:hover { background:#1f2937; }

.main {
    margin-left:240px;
    padding:20px;
}

.card-box {
    background:white;
    padding:20px;
    border-radius:12px;
}
</style>

</head>

<body>

<div class="sidebar">
    <h4>Admin Panel</h4>
    <a href="/">Dashboard</a>
    <a href="/books/">Books</a>
    <a href="/members/">Members</a>
    <a href="/issue/">Issue</a>
</div>

<div class="main">

<h2>Admin Dashboard</h2>

<div class="row mt-4">

    <div class="col-md-4">
        <div class="card-box">
            <h4>{{ books }}</h4>
            <p>Total Books</p>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card-box">
            <h4>{{ members }}</h4>
            <p>Total Members</p>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card-box">
            <h4>{{ issued }}</h4>
            <p>Issued Books</p>
        </div>
    </div>

</div>

</div>

</body>
</html>
