{% extends 'core/base.html' %}

{% block content %}

<h2 class="mb-4">✏️ Edit Member</h2>

<div class="card shadow">
    <div class="card-body">

        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label>Name</label>
                <input type="text"
                       name="name"
                       value="{{ member.name }}"
                       class="form-control">
            </div>

            <div class="mb-3">
                <label>Email</label>
                <input type="email"
                       name="email"
                       value="{{ member.email }}"
                       class="form-control">
            </div>

            <div class="mb-3">
                <label>Phone</label>
                <input type="text"
                       name="phone"
                       value="{{ member.phone }}"
                       class="form-control">
            </div>

            <button class="btn btn-success">
                Update Member
            </button>

            <a href="/members/" class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>
</div>

{% endblock %}
